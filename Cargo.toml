[workspace]
resolver = "3"
members = [
    "crates/jobhunt-ai",
    "crates/jobhunt-app",
    "crates/jobhunt-cloud",
    "crates/jobhunt-core",
    "crates/jobhunt-eligibility",
    "crates/jobhunt-eval",
    "crates/jobhunt-jobs",
    "crates/jobhunt-profile",
    "crates/jobhunt-ranking",
    "crates/jobhunt-resume",
    "crates/jobhunt-sources",
    "crates/jobhunt-storage",
    "crates/jobhunt-cli",
    "crates/jobhunt-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates
jobhunt-ai = { path = "crates/jobhunt-ai" }
jobhunt-app = { path = "crates/jobhunt-app" }
jobhunt-cloud = { path = "crates/jobhunt-cloud" }
jobhunt-core = { path = "crates/jobhunt-core" }
jobhunt-eligibility = { path = "crates/jobhunt-eligibility" }
jobhunt-eval = { path = "crates/jobhunt-eval" }
jobhunt-jobs = { path = "crates/jobhunt-jobs" }
jobhunt-profile = { path = "crates/jobhunt-profile" }
jobhunt-mcp = { path = "crates/jobhunt-mcp" }
jobhunt-ranking = { path = "crates/jobhunt-ranking" }
jobhunt-resume = { path = "crates/jobhunt-resume" }
jobhunt-sources = { path = "crates/jobhunt-sources" }
jobhunt-storage = { path = "crates/jobhunt-storage" }

# External crates
aes-gcm = "0.11"
anstream = "1"
anstyle = "1"
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1", "http2", "matched-path"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.4"
directories = "6"
futures = "0.3"
getrandom = "0.4"
http = "1"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
pdf-extract = "0.12.1"
rmcp = { version = "3.4.1", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "gzip"] }
schemars = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "chrono", "json", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "limit", "request-id", "sensitive-headers", "catch-panic"] }
toml = "1.1"
unicode-normalization = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
wiremock = "0.6"
# Reading LinkedIn data exports: only the deflate decoder (no encryption,
# no other codecs).
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
