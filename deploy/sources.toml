# Narrow's source registry (BRU-343; docs/source-discovery-and-career-pages.md).
#
# What is known about each job board beyond "it is configured": company,
# careers page, provenance and lifecycle status
# (candidate → validated → active; active → unhealthy; disabled; rejected).
# deploy/cloud.toml stays the list production reads: the entries marked
# active here are exactly its sources (a test checks it), so activating a
# board means adding it to both files.
#
# Scan-time facts (last scan, last success, open jobs, last error, health)
# are derived from the database by `narrow sources report --registry
# deploy/sources.toml`, never stored here. Reasons record the measurement
# behind each status; `narrow sources discover --registry` adds and updates
# candidate, validated and rejected entries and never overwrites active,
# unhealthy or disabled ones.

